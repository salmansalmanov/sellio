databaseChangeLog:
  - changeSet:
      id: 1.1.1-add-missing-columns-to-users-and-images
      author: salmansalmanov
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - addColumn:
            tableName: images
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP