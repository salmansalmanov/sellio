databaseChangeLog:
  - changeSet:
      id: 1.1.4-refactor-foreign-key-constraints
      author: salmansalmanov
      changes:
        - dropForeignKeyConstraint:
            baseTableName: shops
            constraintName: fk_shops_users_id
        - dropForeignKeyConstraint:
            baseTableName: admins
            constraintName: fk_admins_accounts_id
        - dropForeignKeyConstraint:
            baseTableName: customers
            constraintName: fk_customers_accounts_id
        - addForeignKeyConstraint:
            baseTableName: shops
            baseColumnNames: id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_shops_id_users_id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: admins
            baseColumnNames: id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_admins_id_users_id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: customers
            baseColumnNames: id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_customers_id_users_id
            onDelete: CASCADE
            onUpdate: CASCADE