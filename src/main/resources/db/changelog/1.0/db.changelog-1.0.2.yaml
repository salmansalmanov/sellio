databaseChangeLog:
  - changeSet:
      id: 1.0.2-create-super_admins-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: super_admins
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR
                  constraints:
                    nullable: false
                    unique: true
        - addForeignKeyConstraint:
            baseTableName: super_admins
            baseColumnNames: id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_super_admins_accounts_id