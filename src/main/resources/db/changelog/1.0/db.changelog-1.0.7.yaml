databaseChangeLog:
  - changeSet:
      id: 1.0.7-rename-shop_name-column-and-add-logo_id-and-banner_id
      author: salmansalmanov
      changes:
        - renameColumn:
            tableName: shops
            oldColumnName: shop_name
            newColumnName: name
        - addColumn:
            tableName: shops
            columns:
              - column:
                  name: logo_id
                  type: UUID
              - column:
                  name: banner_id
                  type: UUID
        - addForeignKeyConstraint:
            baseTableName: shops
            baseColumnNames: logo_id
            referencedTableName: images
            referencedColumnNames: id
            constraintName: fk_shops_images_logo_id
        - addForeignKeyConstraint:
            baseTableName: shops
            baseColumnNames: banner_id
            referencedTableName: images
            referencedColumnNames: id
            constraintName: fk_shops_images_banner_id