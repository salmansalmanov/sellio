databaseChangeLog:
  - changeSet:
      id: 1.0.5-create-shops-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: shops
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shop_name
                  type: VARCHAR
                  constraints:
                    unique: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shops
            baseColumnNames: id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_shops_users_id