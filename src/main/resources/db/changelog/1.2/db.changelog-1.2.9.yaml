databaseChangeLog:
  - changeSet:
      id: 1.2.9-create-listing_properties-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: listing_properties
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: listing_id
                  type: UUID
              - column:
                  name: value_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: listing_properties
            baseColumnNames: listing_id
            referencedTableName: listings
            referencedColumnNames: id
            constraintName: fk_listing_properties_listing_id_listings_id
        - addForeignKeyConstraint:
            baseTableName: listing_properties
            baseColumnNames: value_id
            referencedTableName: property_values
            referencedColumnNames: id
            constraintName: fk_listing_properties_value_id_property_values_id