databaseChangeLog:
  - changeSet:
      id: 1.2.9-create-listings-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: listings
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: is_new
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: has_delivery
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: subcategory_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: listings
            baseColumnNames: subcategory_id
            referencedTableName: subcategories
            referencedColumnNames: id
            constraintName: fk_listings_subcategory_id_subcategories_id