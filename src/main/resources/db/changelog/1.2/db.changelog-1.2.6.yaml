databaseChangeLog:
  - changeSet:
      id: 1.2.6-create-property_values-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: property_values
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: value
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: property_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: property_values
            baseColumnNames: property_id
            referencedTableName: properties
            referencedColumnNames: id
            constraintName: fk_property_values_property_id_properties_id
        - addUniqueConstraint:
            tableName: property_values
            columnNames: property_id, value
            constraintName: uk_property_values_property_id_value