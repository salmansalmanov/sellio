databaseChangeLog:
  - changeSet:
      id: 1.3.5-add-owner_id-to-listings
      author: salmansalmanov
      changes:
        - addColumn:
            tableName: listings
            columns:
              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: listings
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_listings_owner_id_users_id