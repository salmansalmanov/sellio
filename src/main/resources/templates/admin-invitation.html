<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Invitation</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff; padding:40px 0;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border:1px solid #e0e0e0; border-radius:10px; padding:40px;">

                <tr>
                    <td align="center" style="padding-bottom:30px;">
                        <h2 style="margin:0; color:#1b5e20;">
                            Xoş gəlmisiniz!
                        </h2>
                    </td>
                </tr>

                <tr>
                    <td style="color:#000000; font-size:16px; line-height:24px; text-align:center;">
                        <p style="margin:0 0 20px 0;">
                            Super Admin tərəfindən sistemə dəvət edildiniz.
                        </p>

                        <p style="margin:0 0 10px 0;">
                            Sizin qeydiyyat tokeniniz:
                        </p>

                        <p style="margin:20px 0; font-size:20px; font-weight:bold; color:#2e7d32;">
                            ${token}
                        </p>

                        <p style="margin:0 0 10px 0; color:#000000;">
                            Zəhmət olmasa bu token vasitəsilə qeydiyyatı tamamlayın.
                        </p>

                        <p style="margin:0; font-size:14px; color:#d32f2f;">
                            Qeyd: Bu token yalnız 24 saat aktivdir.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding-top:30px; color:#1b5e20; font-size:14px;">
                        <p style="margin:0;">
                            Təşəkkürlər.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
